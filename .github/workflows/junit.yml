name: JUnit tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar JUnit
        run: |
          curl --fail --location \
            --output junit-platform-console-standalone.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compilar código y pruebas
        run: |
          mkdir -p bin
          javac \
            -encoding ISO-8859-1 \
            -cp junit-platform-console-standalone.jar \
            -d bin \
            src/CalculadoraFraccionarios/Fraccion.java \
            test/CalculadoraFraccionarios/FraccionTest.java

      - name: Ejecutar pruebas
        run: |
          java -jar junit-platform-console-standalone.jar execute \
            --class-path bin \
            --scan-class-path
